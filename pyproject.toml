[project]
name = "order-agent"
version = "0.1.0"
description = "Pipecat voice agent that phones a restaurant to place an order"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[google,openai,webrtc,runner,silero,whisper,kokoro,cli]==1.17.0",
    "pyyaml",
    "python-dotenv",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["order_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
