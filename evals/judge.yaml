# Default judge: Groq openai/gpt-oss-20b, throttled for the free tier.
# Why: Pipecat's judge fires ~7 classifier questions at once (plus explainer calls),
# each carrying the whole transcript (~2-3k tokens). Groq's free tier allows 8000
# tokens/minute per model, so un-throttled calls hit the cap and time out.
# The throttle runs one call at a time, >= 20 s apart (~3 questions/min ~ 8000 TPM),
# and retries rate-limit errors with backoff (15 s, 30 s, 60 s).
# Consequence: a full judgement takes a few minutes per call. timeout_s is long
# because queue wait counts toward Pipecat's 10 s classifier timeout.
# Eval and explainer have the same model + settings, so they share one limiter.
eval:
  factory: order_agent.eval_llm.groq_classifier  # LLMClassifier with timeout_s
  model: openai/gpt-oss-20b
  reasoning_effort: low
  max_concurrency: 1
  min_interval_s: 20
  max_retries: 3
  retry_base_s: 15
  timeout_s: 300
explainer:
  factory: order_agent.eval_llm.groq_llm  # must be a service, not a classifier
  model: openai/gpt-oss-20b
  reasoning_effort: low
  max_concurrency: 1
  min_interval_s: 20
  max_retries: 3
  retry_base_s: 15
