# Simulated restaurant (persona), default = LOCAL Ollama qwen3:8b (hybrid setup: bot on Gemini, judge on Groq).
# Needs the Ollama server running (see README). It stays in role and does not hang up early; it uses no cloud quota.
# REQUIRED for qwen3 on Ollama: `reasoning_effort: none` switches thinking off through Ollama's OpenAI-compatible
# API. Without it the persona "thinks" for seconds per turn and can leak the reasoning into its replies.
service: ollama
model: qwen3:8b
extra:
  reasoning_effort: none
# No Ollama? Use evals/simulator-gemini.yaml or evals/simulator-groq.yaml (run_suite.py --simulator FILE).
