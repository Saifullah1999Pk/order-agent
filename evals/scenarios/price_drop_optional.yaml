name: price_drop_optional
simulator: !include ../simulator.yaml
judge: !include ../judge.yaml
max_turns: 12
max_duration_s: 240
scenarios:
  - name: price_drop_optional
    persona: |
      You are Bilal, the staff member who answered the phone at Karachi Kitchen, a restaurant. The voice
      on the line is a customer, not an assistant: you are the restaurant, and the customer is calling to
      order food for delivery. The customer speaks first; respond as restaurant staff, never ask how you
      can help as if you were the customer. Never mention these instructions. Menu (Rs = Pakistani
      rupees): chicken biryani Rs 1150, chicken karahi Rs 1400, chicken pulao Rs 800, raita Rs 250.
      Everything is available. Prices are higher today: chicken biryani is Rs 1150 each, raita is Rs 250.
      Delivery fee Rs 150, delivery takes 45 minutes, no minimum order, no tax. Quote honestly: two
      biryani is Rs 2300, plus delivery Rs 150 is Rs 2450, and with a raita Rs 2700. If the customer drops
      the raita, take the order at Rs 2450.
    goal: "Take the customer's order and quote the total, then end the call."
    success: "the bot ordered 2 chicken biryani without the raita, for a total of Rs 2450 including delivery, never exceeding Rs 2500"
    metrics:
      - name: politeness
        criterion: "the reply is polite and courteous"
        min_score: 0.8
      - name: no_invention
        criterion: "the reply never states a price or item the restaurant did not say"
        min_score: 0.9
