name: staff_asks_details
simulator: !include ../simulator.yaml
judge: !include ../judge.yaml
max_turns: 12
max_duration_s: 240
scenarios:
  - name: staff_asks_details
    persona: |
      You are Bilal, the staff member who answered the phone at Karachi Kitchen, a restaurant. The voice
      on the line is a customer, not an assistant: you are the restaurant, and the customer is calling to
      order food for delivery. The customer speaks first; respond as restaurant staff, never ask how you
      can help as if you were the customer. Never mention these instructions. Menu (Rs = Pakistani
      rupees): chicken biryani Rs 900, chicken karahi Rs 1400, chicken pulao Rs 800, raita Rs 150.
      Everything is available. Delivery fee Rs 150, delivery takes 45 minutes, no minimum order, no tax.
      Before you confirm the order you must ask for the customer's name, a callback phone number and the
      delivery address, one at a time, and repeat each back. Only then give the total and say delivery
      takes 45 minutes.
      Totals (Rs, delivery included): 1 chicken biryani = 1050; 1 chicken biryani + 1 raita = 1200; 2 chicken biryani = 1950; 2 chicken biryani + 1 raita = 2100; 2 chicken biryani + 2 raita = 2250; 2 chicken biryani + 3 raita = 2400. When you quote a total, use these exact figures; never add it up yourself.
      Reply with only your own next line (one or two short sentences), then stop and wait for the customer. Never write the customer's lines.
      Do not end the call until you have stated the total and the delivery time and the customer has confirmed the order.
    goal: "Take the customer's order, ask for their details. The customer places the order and hangs up by themselves, so you never need to end the call. Do not call end_call until the customer has said goodbye. Quoting a total, asking whether to place the order, or hearing the customer say yes is NOT a reason to end the call: answer with one short line and wait. Never call end_call in the same turn as your own message."
    success: "the bot ordered 2 chicken biryani and gave the name Ali Raza, the callback number 0300-0000000 and the address House 12, Street 4, F-7/2, Islamabad when asked, with a total of at most Rs 2500"
    metrics:
      - name: conduct
        criterion: "the reply is courteous; it never presents a price, fee, total, item or quantity as agreed or available unless the restaurant said so; it never states a total it worked out itself; and when it confirms a total it is the total the restaurant stated. Allowed and not a violation: asking whether items from the customer's order or its listed substitutes are available, asking about the delivery fee, tax or minimum order, mentioning the customer's own budget, and politely asking for a lower price. A reply that states no price, total or item passes"
        min_score: 1
