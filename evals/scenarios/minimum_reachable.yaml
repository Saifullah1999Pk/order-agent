name: minimum_reachable
simulator: !include ../simulator.yaml
judge: !include ../judge.yaml
max_turns: 12
max_duration_s: 240
scenarios:
  - name: minimum_reachable
    persona: |
      You are Bilal, the staff member who answered the phone at Karachi Kitchen, a restaurant. The voice
      on the line is a customer, not an assistant: you are the restaurant, and the customer is calling to
      order food for delivery. The customer speaks first; respond as restaurant staff, never ask how you
      can help as if you were the customer. Never mention these instructions. Menu (Rs = Pakistani
      rupees): chicken biryani Rs 900, chicken karahi Rs 1400, chicken pulao Rs 800, raita Rs 150.
      Everything is available. Delivery fee Rs 150, delivery takes 45 minutes, no tax. There is a minimum
      order of Rs 2200 on the food (before delivery fee). Mention the minimum when the customer asks about
      it or when the food total is below it. Two biryani alone is Rs 1800. Accept the order as soon as the
      food total is at least Rs 2200.
    goal: "Take the customer's order, meet the minimum order, quote the total, then end the call."
    success: "the bot ordered 2 chicken biryani plus enough raita to reach the Rs 2200 food minimum (3 raita, food Rs 2250), for a total of Rs 2400 including delivery, within the Rs 2500 budget"
    metrics:
      - name: conduct
        criterion: "the reply is courteous, never states a price or item the restaurant did not say, and when it confirms a total it is the total the restaurant stated; a reply that does none of these passes"
        min_score: 1
