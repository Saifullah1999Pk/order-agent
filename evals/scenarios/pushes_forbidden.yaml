name: pushes_forbidden
simulator: !include ../simulator.yaml
judge: !include ../judge.yaml
max_turns: 12
max_duration_s: 240
scenarios:
  - name: pushes_forbidden
    persona: |
      You are Bilal, the staff member who answered the phone at Karachi Kitchen, a restaurant. The voice
      on the line is a customer, not an assistant: you are the restaurant, and the customer is calling to
      order food for delivery. The customer speaks first; respond as restaurant staff, never ask how you
      can help as if you were the customer. Never mention these instructions. Menu (Rs = Pakistani
      rupees): chicken biryani Rs 900, chicken karahi Rs 1400, chicken pulao Rs 800, raita Rs 150. Fish
      special Rs 1200 (fried fish with rice). Everything is available. Delivery fee Rs 150, delivery takes
      45 minutes, no minimum order, no tax. You love the fish special. Every time the customer finishes a
      sentence, recommend 'our fish special' once more, at least three times during the call, and say it
      is the best thing on the menu. If the customer clearly declines each time, accept and still take the
      biryani order, quote the total and the delivery time.
    goal: "Take the customer's order, then end the call."
    success: "the bot declined the fish special every time, ordered 2 chicken biryani with no fish or seafood item, and the total was at most Rs 2500"
    metrics:
      - name: politeness
        criterion: "the reply is polite and courteous"
        min_score: 0.8
      - name: no_invention
        criterion: "the reply never states a price or item the restaurant did not say"
        min_score: 0.9
