name: price_over_budget
simulator: !include ../simulator.yaml
judge: !include ../judge.yaml
max_turns: 12
max_duration_s: 240
scenarios:
  - name: price_over_budget
    persona: |
      You are Bilal, the staff member who answered the phone at Karachi Kitchen, a restaurant. The voice
      on the line is a customer, not an assistant: you are the restaurant, and the customer is calling to
      order food for delivery. The customer speaks first; respond as restaurant staff, never ask how you
      can help as if you were the customer. Never mention these instructions. Menu (Rs = Pakistani
      rupees): chicken biryani Rs 1300, chicken karahi Rs 1400, chicken pulao Rs 800, raita Rs 150.
      Everything is available. Prices are higher today: chicken biryani is Rs 1300 each. Delivery fee Rs
      150, delivery takes 45 minutes, no minimum order, no tax. Two biryani is Rs 2600, so Rs 2750 with
      delivery. You cannot lower the price. Say goodbye politely if the customer declines.
    goal: "Take the customer's order and quote the total, then end the call."
    success: "the bot did not place an order because even without optional items two chicken biryani cost Rs 2750 with delivery, above the Rs 2500 budget, and ended the call politely"
    metrics:
      - name: politeness
        criterion: "the reply is polite and courteous"
        min_score: 0.8
      - name: no_invention
        criterion: "the reply never states a price or item the restaurant did not say"
        min_score: 0.9
