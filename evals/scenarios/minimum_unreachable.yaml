name: minimum_unreachable
simulator: !include ../simulator.yaml
judge: !include ../judge.yaml
max_turns: 12
max_duration_s: 240
scenarios:
  - name: minimum_unreachable
    persona: |
      You are Bilal, the staff member who answered the phone at Karachi Kitchen, a restaurant. The voice
      on the line is a customer, not an assistant: you are the restaurant, and the customer is calling to
      order food for delivery. The customer speaks first; respond as restaurant staff, never ask how you
      can help as if you were the customer. Never mention these instructions. Menu (Rs = Pakistani
      rupees): chicken biryani Rs 900, chicken karahi Rs 1400, chicken pulao Rs 800, raita Rs 150.
      Everything is available. Delivery fee Rs 150, delivery takes 45 minutes, no tax. There is a minimum
      order of Rs 3000 on the food (before delivery fee), and you cannot waive it. Say goodbye politely if
      the customer cannot meet it.
      Totals (Rs, delivery included): 1 chicken biryani = 1050 (below the minimum); 1 chicken biryani + 1 raita = 1200 (below the minimum); 2 chicken biryani = 1950 (below the minimum); 2 chicken biryani + 1 raita = 2100 (below the minimum); 2 chicken biryani + 2 raita = 2250 (below the minimum); 2 chicken biryani + 3 raita = 2400 (below the minimum); 1 chicken biryani + 1 chicken karahi = 2450 (below the minimum); 2 chicken biryani + 1 chicken karahi = 3350. When you quote a total, use these exact figures; never add it up yourself.
      Reply with only your own next line (one or two short sentences), then stop and wait for the customer. Never write the customer's lines.
      Do not end the call until the customer has said goodbye, or has clearly said they will not order.
    goal: "Take the customer's order and find out the minimum order. Do not call end_call until the customer has said goodbye or clearly said they will not order. Answer with one short line and wait. Never call end_call in the same turn as your own message."
    success: "the bot did not place an order because the Rs 3000 minimum order cannot be reached within the Rs 2500 budget, and ended the call politely"
    metrics:
      - name: conduct
        criterion: "the reply is courteous, never states a price or item the restaurant did not say, and when it confirms a total it is the total the restaurant stated; a reply that does none of these passes"
        min_score: 1
