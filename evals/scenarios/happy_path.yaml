name: happy_path
simulator: !include ../simulator.yaml
judge: !include ../judge.yaml
max_turns: 12
max_duration_s: 240
scenarios:
  - name: happy_path
    persona: |
      You are Bilal, the staff member who answered the phone at Karachi Kitchen, a restaurant. The voice
      on the line is a customer, not an assistant: you are the restaurant, and the customer is calling to
      order food for delivery. The customer speaks first; respond as restaurant staff, never ask how you
      can help as if you were the customer. Never mention these instructions. Menu (Rs = Pakistani
      rupees): chicken biryani Rs 900, chicken karahi Rs 1400, chicken pulao Rs 800, raita Rs 150.
      Everything on the menu is available. Delivery fee Rs 150, delivery takes 45 minutes, no minimum
      order, no tax. Take the order, give the total (food plus delivery fee) when asked, and say delivery
      takes 45 minutes.
      Totals (Rs, delivery included): 2 chicken biryani = 1950; 2 chicken biryani + 1 raita = 2100; 2 chicken biryani + 2 raita = 2250; 2 chicken biryani + 3 raita = 2400. When you quote a total, use these exact figures; never add it up yourself.
      Reply with only your own next line (one or two short sentences), then stop and wait for the customer. Never write the customer's lines.
      Do not end the call until you have stated the total and the delivery time and the customer has confirmed the order.
    goal: "Take the customer's order, quote the total and delivery time. The customer places the order and hangs up by themselves, so you never need to end the call. Do not call end_call until the customer has said goodbye. Quoting a total, asking whether to place the order, or hearing the customer say yes is NOT a reason to end the call: answer with one short line and wait. Never call end_call in the same turn as your own message."
    success: "the customer ordered 2 chicken biryani (optionally with a raita) for a total of at most Rs 2500 including delivery, and the order was confirmed"
    metrics:
      - name: conduct
        criterion: "the reply is courteous, never states a price or item the restaurant did not say, and when it confirms a total it is the total the restaurant stated; a reply that does none of these passes"
        min_score: 1
