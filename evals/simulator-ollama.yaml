# Simulated restaurant (persona), default = LOCAL Ollama qwen3:8b (hybrid setup: bot on Gemini, judge on Groq).
# Needs the Ollama server running (see README). It stays in role and does not hang up early; it uses no cloud quota.
# `reasoning_effort: none` switches qwen3's thinking off through Ollama's OpenAI-compatible API.
service: ollama
model: qwen3:8b
extra:
  reasoning_effort: none
# Alternative: Gemini native persona (never hung up in the same turn, but spends Gemini quota shared with the bot):
# factory: order_agent.eval_llm.gemini_native_llm
# model: gemini-3.5-flash-lite
# Alternative: Groq persona (free tier; hung up early in 19 of 36 ordered-scenario calls):
# factory: order_agent.eval_llm.groq_llm
# model: openai/gpt-oss-120b
