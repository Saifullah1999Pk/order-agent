# All-local judge on Ollama. Select with:
#   run_suite.py --judge evals/judge-ollama.yaml
# The factory only exists to raise Pipecat's 10 s classifier timeout: the judge asks ~7 questions at
# once and a local GPU answers them a few at a time. Thinking is off via `reasoning_effort: none`.
# (run_suite uses the `eval:` block; `explainer:` is kept for Pipecat versions that read it.)
eval:
  factory: order_agent.eval_llm.ollama_classifier
  model: qwen3:8b
  timeout_s: 300
explainer:
  service: ollama
  model: qwen3:8b
  extra:
    reasoning_effort: none
